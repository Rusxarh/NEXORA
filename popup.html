<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>NEXORA Connector</title>
<style>
  body { font-family: system-ui, sans-serif; width: 320px; padding: 12px; background:#18181b; color:#f4f4f5; }
  h1 { font-size: 14px; margin: 0 0 10px; }
  label { display:block; font-size:11px; color:#a1a1aa; margin-top:8px; }
  select, input { width:100%; box-sizing:border-box; padding:6px; margin-top:2px; background:#27272a; border:1px solid #3f3f46; color:#f4f4f5; border-radius:4px; }
  button { margin-top:10px; width:100%; padding:8px; background:#4f46e5; color:#fff; border:none; border-radius:4px; cursor:pointer; font-weight:600; font-size:13px; }
  button:disabled { opacity:.5; cursor:not-allowed; }
  #estado { margin-top:10px; font-size:12px; padding:8px; background:#27272a; border-radius:4px; white-space:pre-wrap; min-height: 16px; }
  #acciones { display:none; gap:6px; margin-top:8px; }
  #acciones button { background:#3f3f46; }
  #accionesDiagnostico { display:none; gap:6px; margin-top:8px; }
  #accionesDiagnostico button { background:#78350f; }
  pre#jsonBox { display:none; max-height:220px; overflow:auto; background:#09090b; padding:8px; border-radius:4px; font-size:11px; margin-top:8px; white-space:pre-wrap; word-break:break-all; }
</style>
</head>
<body>
  <h1>NEXORA CONNECTOR</h1>

  <label>Fuente</label>
  <select id="fuente">
    <option value="RGM">RGM</option>
    <option value="JUDICIAL">JUDICIAL (Nombre/Razón Social)</option>
    <option value="RGM_JUDICIAL">RGM → JUDICIAL (encadenado)</option>
  </select>

  <label id="labelEntrada">Placa</label>
  <input id="placa" type="text" value="GCT953" maxlength="120">

  <button id="btnConsultar">CONSULTAR</button>

  <label>Estado</label>
  <div id="estado">Esperando...</div>

  <div id="acciones">
    <button id="btnVerJson">Ver JSON</button>
    <button id="btnCopiarJson">Copiar JSON</button>
  </div>

  <div id="accionesDiagnostico">
    <button id="btnVerDiagnostico">DIAGNOSTICO DOM</button>
    <button id="btnCopiarDiagnostico">Copiar diagnostico</button>
  </div>

  <pre id="jsonBox"></pre>

  <script src="popup.js"></script>
</body>
</html>
